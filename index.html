<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gila Trail Work Dashboard</title>
    
    <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="main-container">
    <button id="toggle-btn" onclick="toggleSidebar()">◀</button>
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>Gila Field Crews</h2>
        </div>

        <section class="sidebar-section">
            <h3 class="subheading">View Mode</h3>
            <div class="view-toggle">
                <!-- Pass strings to setView -->
                <button onclick="setView('map')">Map</button>
                <button onclick="setView('calendar')">Calendar</button>
                <button onclick="setView('both')">Split</button>
            </div>
        </section>

        <hr class="divider">

        <section class="sidebar-section">
            <h3 class="subheading">Legend</h3>
            <div id="legend-container"></div>
            
            <div class="control-group">
                <label for="style-select">Style Points By:</label>
                <select id="style-select" onchange="updateMapStyle(this.value)">
                    <option value="org_type">Organization Type</option>
                    <option value="crew_type">Crew Type</option>
                    <option value="work_type">Work Type</option>
                    <option value="status">Work Status</option>
                </select>
            </div>
        </section>

        <hr class="divider">

        <section class="sidebar-section">
            <h3 class="subheading">Filter Mode</h3>
            <div class="mode-toggle">
                <input type="radio" id="mode-quick" name="filterMode" value="quick" checked onchange="switchFilterMode('quick')">
                <label for="mode-quick">Quick</label>
                
                <input type="radio" id="mode-advanced" name="filterMode" value="advanced" onchange="switchFilterMode('advanced')">
                <label for="mode-advanced">Advanced</label>
            </div>
        </section>

        <div id="quick-filter-ui">
            <section class="sidebar-section">
                <h3 class="subheading">Quick Filters</h3>
                <div class="quick-filter">
                    <input type="checkbox" id="in-field-check" onchange="applyFilters()">
                    <label for="in-field-check">Currently In Field</label><br>
                    <input type="checkbox" id="hide-past-work" onchange="applyFilters()" checked>
                    <label for="hide-past-work">Hide Past Field Work</label>
                </div>

                <div class="filter-group">
                    <label>Work Type</label>
                    <div class="bulk-actions">
                        <button onclick="toggleAllWorkTypes(true)">All</button>
                        <button onclick="toggleAllWorkTypes(false)">None</button>
                    </div>
                    <div id="work-type-checkboxes"></div>
                </div>
            </section>
        </div>

        <div id="advanced-filter-ui" style="display: none;">
            <section class="sidebar-section">
                <h3 class="subheading">Advanced Filters</h3>
                <div id="builder-container"></div>
                <button class="add-filter-btn" onclick="addFilterRow()">+ Add Filter Row</button>
            </section>
        </div>
    </div>

    <!-- The class here controls the Grid layout via your CSS -->
    <div id="content-area" class="view-map"> 
        <div id="map"></div>
        
        <!-- Calendar starts hidden, but setView('calendar') or setView('both') will show it -->
        <div id="calendar-container" style="display: none;">
            <div id="calendar-header">
                <button onclick="changeMonth(-1)">◀</button>
                <h2 id="current-month-display">May 2026</h2>
                <button onclick="changeMonth(1)">▶</button>
            </div>
            <div id="calendar-grid"></div>
        </div>
    </div>
</div>

<script src="map-logic.js"></script>
</body>
</html>
